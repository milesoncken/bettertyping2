name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: `packageManager` in package.json is the one
      # place pnpm's version is pinned, and the action fails outright if a second
      # place disagrees with it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Build exactly what Render builds, so a green CI means a green deploy.
      - run: pnpm build
